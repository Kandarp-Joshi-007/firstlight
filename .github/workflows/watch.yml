name: firstlight

# Netlify cannot run this: its Functions are JavaScript/TypeScript and Go only,
# and scheduled functions cap at 30 seconds. GitHub Actions runs Python natively
# with no such limit, and committing the result gives the dashboard its data
# AND an independent, tamper-evident record of when each domain was detected -
# which is the evidence behind any "found it before the blocklists" claim.

on:
  schedule:
    - cron: "0 6 * * *"         # 06:00 UTC daily. Running once a day means one
                                # BIG pass rather than many small ones - see
                                # --batches below. Scheduled runs are delayed
                                # under load, so treat the time as approximate.
  workflow_dispatch:            # lets you trigger a run by hand

permissions:
  contents: write               # needed to commit data.json back

concurrency:
  group: firstlight              # never let two collectors race on the DB
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet cryptography

      # The SQLite file is the dedup memory across runs. Without it every run
      # re-reports the same domains and re-pays Jev for them.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: firstlight.db
          key: firstlight-db-${{ github.run_id }}
          restore-keys: firstlight-db-

      - name: Collect
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        # 1,200 batches x 64 = ~77k certificates, ~7 minutes, ~500 MB.
        # At 48 runs/day 120 was right; at 1 run/day it would see almost
        # nothing, so the per-run volume goes up tenfold to compensate.
        run: python watch.py --once --batches 1200

      # Idempotent: backfill.py skips domains already in the database, so this
      # scores the seed once and is a no-op on every later run. It exists so the
      # dashboard shows a validated result while live detections accumulate -
      # Irish-brand impersonation appears about once per 60,000 names observed.
      - name: Seed validated examples (once)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python backfill.py seed/irish-candidates.txt --name phishdb --limit 300

      - name: Export dashboard data
        run: python watch.py --export site/data.json

      - name: Save state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: firstlight.db
          key: firstlight-db-${{ github.run_id }}

      # A run takes ~20 minutes, so main can move underneath it - a push from a
      # laptop, or another run finishing. The original step had no rebase and no
      # retry, so any commit landing in that window failed the job after all the
      # collection work had already succeeded. Rebase and retry instead.
      - name: Publish
        run: |
          git config user.name  "firstlight"
          git config user.email "firstlight@users.noreply.github.com"
          git add site/data.json
          git diff --staged --quiet && echo "nothing new to publish" && exit 0
          git commit -m "detections: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/main and retrying"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "could not publish after 3 attempts" >&2
          exit 1
